name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP files
        run: |
          find . -name "*.php" -not -path "./back/bower_components/*" -print0 |
            xargs -0 -n1 php -l

      - name: Validate JSON configuration
        run: |
          for f in socket_config.json socket_config2.json arcade_config.json; do
            jq empty "$f"
          done
